# =====================================================================
#  Pipeline Blindado - CI/CD com DevSecOps no GitHub Actions
#  Branches: dev -> homolog -> pre-prod -> main   (sustain = correções)
#  Equivalente ao Jenkinsfile do repositório (mesmos estágios e portões)
# =====================================================================
name: Pipeline Blindado

on:
  push:
    branches: [main, dev, homolog, pre-prod, sustain, 'ataque/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um pipeline por branch de cada vez; um push novo cancela o anterior
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # JOB 1 - Integração contínua + portões de segurança (falham rápido)
  # Roda em TODAS as branches, inclusive as de ataque.
  # -------------------------------------------------------------------
  ci:
    name: 1. CI e portões de segurança
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo para o Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 2. Portão de dependências (typosquatting)
        id: deps
        # Roda ANTES do npm ci: um pacote malicioso nunca chega a ser instalado
        run: node scripts/verificar-dependencias.js

      - name: 3. Instalar dependências
        id: install
        run: npm ci --ignore-scripts --no-fund

      - name: 4a. Segredos nos arquivos (secretlint)
        id: secretlint
        run: npx secretlint "**/*" && echo "Nenhum segredo encontrado nos arquivos."

      - name: 4b. Segredos no histórico do Git (Gitleaks)
        id: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

      - name: 5a. Lint (ESLint)
        id: lint
        run: npm run lint && echo "ESLint - 0 problemas."

      - name: 5b. Testes automatizados + cobertura
        id: testes
        run: >
          node --test --experimental-test-coverage --test-coverage-include="src/**"
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=junit.xml
          test/*.test.js

      - name: 5c. SAST (Semgrep)
        id: sast
        run: |
          pipx install semgrep > /dev/null
          semgrep scan --config semgrep.yml --metrics=off --error src/

      - name: 6. SCA - vulnerabilidades em dependências (npm audit)
        id: sca
        run: npm audit --omit=dev --audit-level=high

      - name: 9a. SBOM do código (CycloneDX)
        id: sbom
        run: npx cyclonedx-npm --omit dev --output-file sbom.cdx.json

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-ci
          path: |
            junit.xml
            sbom.cdx.json
          if-no-files-found: ignore

      - name: Resumo dos portões
        if: always()
        run: |
          icone() { case "$1" in success) echo "✅ aprovado";; failure) echo "❌ BLOQUEADO";; skipped) echo "⏭️ não executado";; *) echo "$1";; esac; }
          {
            echo "## 🛡️ Portões de segurança - branch \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "| Estágio | Ferramenta | Resultado |"
            echo "|---|---|---|"
            echo "| 2. Dependências (typosquatting) | script próprio | $(icone '${{ steps.deps.outcome }}') |"
            echo "| 3. Instalação | npm ci | $(icone '${{ steps.install.outcome }}') |"
            echo "| 4a. Segredos nos arquivos | secretlint | $(icone '${{ steps.secretlint.outcome }}') |"
            echo "| 4b. Segredos no histórico | Gitleaks | $(icone '${{ steps.gitleaks.outcome }}') |"
            echo "| 5a. Lint | ESLint | $(icone '${{ steps.lint.outcome }}') |"
            echo "| 5b. Testes | node:test | $(icone '${{ steps.testes.outcome }}') |"
            echo "| 5c. SAST | Semgrep | $(icone '${{ steps.sast.outcome }}') |"
            echo "| 6. SCA | npm audit | $(icone '${{ steps.sca.outcome }}') |"
            echo "| 9a. SBOM | CycloneDX | $(icone '${{ steps.sbom.outcome }}') |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------
  # JOB 2 - Artefato: construído UMA vez, verificado, assinado e publicado
  # Não roda em branches de ataque nem em pull requests.
  # -------------------------------------------------------------------
  imagem:
    name: 2. Imagem, scan, SBOM e assinatura
    needs: ci
    if: github.event_name != 'pull_request' && !startsWith(github.ref_name, 'ataque/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # publicar no GitHub Container Registry
      id-token: write     # assinatura keyless (Sigstore/cosign)
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome e versão da imagem
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/tarefas-api"
          VERSION=$(node -p "require('./package.json').version")
          TAG="${VERSION}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Imagem: $IMAGE:$TAG"

      - name: 7. Build da imagem Docker (multi-stage, não-root)
        run: >
          docker build --pull -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }} .

      - name: 8. Scan da imagem (Trivy) - reprova se houver CRÍTICA
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$HOME/bin"
          REF=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          echo "=== Relatório informativo (HIGH e CRITICAL) ==="
          "$HOME/bin/trivy" image --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$REF"
          echo "=== Portão: reprova se existir vulnerabilidade CRITICAL corrigível ==="
          "$HOME/bin/trivy" image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress --quiet "$REF"
          echo "Trivy: nenhuma vulnerabilidade CRITICAL. Portão aprovado."

      - name: 9b. SBOM da imagem (Syft)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$HOME/bin"
          "$HOME/bin/syft" ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} -o spdx-json=sbom.spdx.json
          echo "SBOM gerado com $(jq '.packages | length' sbom.spdx.json) pacotes."

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 10. Publicar no registry (por digest)
        id: push
        run: |
          IMAGE=${{ steps.meta.outputs.image }}
          docker push $IMAGE:${{ steps.meta.outputs.tag }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:${{ steps.meta.outputs.tag }} | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Imagem publicada: $IMAGE@$DIGEST"

      - name: Instalar cosign
        uses: sigstore/cosign-installer@v3

      - name: 11. Assinar imagem e anexar SBOM (cosign keyless)
        run: |
          REF=${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: 11b. Verificar a assinatura
        run: |
          cosign verify ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }} \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/pipeline.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            | jq '.[0] | {imagem: .critical.identity["docker-reference"], digest: .critical.image["docker-manifest-digest"], assinado_por: .optional.Subject, emissor: .optional.Issuer}'

      - name: Guardar SBOM da imagem
        uses: actions/upload-artifact@v4
        with:
          name: sbom-imagem
          path: sbom.spdx.json

      - name: Resumo do artefato
        run: |
          {
            echo "## 📦 Artefato publicado e assinado"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Imagem | \`${{ steps.meta.outputs.image }}\` |"
            echo "| Tag | \`${{ steps.meta.outputs.tag }}\` |"
            echo "| Digest (imutável) | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Assinatura | cosign keyless (Sigstore) + atestado SBOM SPDX |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------
  # JOB 3 - Ataque 3: o cluster só aceita imagens assinadas pelo pipeline
  # -------------------------------------------------------------------
  politica-assinatura:
    name: 3. Kyverno - só imagem assinada (Ataque 3)
    needs: imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.imagem.outputs.image }}
      DIGEST: ${{ needs.imagem.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Criar cluster Kubernetes (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: politica

      - name: Preparar Helm
        uses: azure/setup-helm@v4

      - name: Instalar Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm install kyverno kyverno/kyverno -n kyverno --create-namespace --version "~3.2.0" --wait --timeout 6m
          kubectl -n kyverno create secret docker-registry ghcr --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} --docker-password=${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar política "somente imagens assinadas"
        run: |
          sed "s#REPOSITORIO#${GITHUB_REPOSITORY,,}#g" k8s/kyverno-keyless-github.yaml | kubectl apply -f -
          kubectl wait clusterpolicy/somente-imagens-assinadas --for=condition=Ready --timeout=180s
          kubectl get clusterpolicy
          kubectl create namespace tarefas-teste

      - name: Imagem OFICIAL (assinada pelo pipeline) é aceita
        run: |
          kubectl -n tarefas-teste run oficial --image="$IMAGE@$DIGEST" --restart=Never --dry-run=server -o name
          echo "=== Imagem oficial ACEITA pelo cluster ==="

      - name: Login no GHCR (para o invasor publicar a imagem dele)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ATAQUE 3 - imagem com backdoor, construída fora do pipeline
        run: |
          INVASOR="$IMAGE:invasor-${GITHUB_RUN_NUMBER}"
          printf 'FROM %s\nRUN echo "backdoor" > /tmp/backdoor\n' "$IMAGE@$DIGEST" | docker build -t "$INVASOR" -
          docker push "$INVASOR"
          echo "=== Tentando implantar a imagem NÃO assinada: $INVASOR ==="
          if kubectl -n tarefas-teste run invasor --image="$INVASOR" --restart=Never --dry-run=server 2> erro.txt; then
            echo "::error::FALHA DE SEGURANÇA: imagem não assinada foi aceita!"
            exit 1
          fi
          cat erro.txt
          echo "=== RESULTADO: ataque BLOQUEADO pelo Kyverno (assinatura ausente) ==="
          echo "## 🚫 Ataque 3 bloqueado: o Kyverno recusou a imagem não assinada \`$INVASOR\`" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------
  # JOB 4 - Entrega: deploy com Helm no ambiente da branch
  # main exige aprovação manual (Environment "producao")
  # -------------------------------------------------------------------
  deploy:
    name: 4. Deploy (${{ github.ref_name }})
    needs: imagem
    if: contains(fromJSON('["dev", "homolog", "pre-prod", "main"]'), github.ref_name)
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'producao' || github.ref_name }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.imagem.outputs.image }}
      DIGEST: ${{ needs.imagem.outputs.digest }}
      TAG: ${{ needs.imagem.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir ambiente
        run: |
          case "$GITHUB_REF_NAME" in
            main) AMB=prod ;;
            pre-prod) AMB=preprod ;;
            *) AMB=$GITHUB_REF_NAME ;;
          esac
          echo "AMB=$AMB" >> "$GITHUB_ENV"
          echo "NS=tarefas-$AMB" >> "$GITHUB_ENV"

      - name: Criar cluster Kubernetes (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: blindado

      - name: Preparar Helm
        uses: azure/setup-helm@v4

      - name: Preparar namespace e acesso ao registry
        run: |
          kubectl create namespace "$NS"
          kubectl -n "$NS" create secret docker-registry ghcr --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} --docker-password=${{ secrets.GITHUB_TOKEN }}

      - name: 13. Deploy com Helm (digest imutável)
        run: |
          helm lint helm/tarefas-api -f helm/tarefas-api/values-$AMB.yaml --set image.digest="$DIGEST"
          helm upgrade --install tarefas-api helm/tarefas-api \
            --namespace "$NS" \
            -f helm/tarefas-api/values-$AMB.yaml \
            --set image.repository="$IMAGE" \
            --set image.digest="$DIGEST" \
            --set appVersion="$TAG" \
            --set 'imagePullSecrets[0].name=ghcr' \
            --wait --timeout 5m --rollback-on-failure

      - name: 14. Smoke test (GET /health)
        run: |
          kubectl -n "$NS" port-forward svc/tarefas-api 8080:80 > /dev/null 2>&1 &
          sleep 5
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080/health
          echo ""
          echo "=== Smoke test APROVADO ==="

      - name: Estado do ambiente
        if: always()
        run: |
          kubectl -n "$NS" get pods -o wide || true
          helm history tarefas-api -n "$NS" || true

      - name: Rollback automático se o smoke test falhar
        if: failure()
        run: helm rollback tarefas-api -n "$NS" || echo "Primeira instalação - nada para reverter."

      - name: Resumo do deploy
        if: success()
        run: |
          {
            echo "## 🚀 Deploy concluído em \`$NS\`"
            echo ""
            echo "- Imagem: \`$IMAGE@$DIGEST\`"
            echo "- Versão: \`$TAG\`"
            echo "- Réplicas: $(kubectl -n "$NS" get deploy tarefas-api -o jsonpath='{.status.readyReplicas}') prontas"
            echo "- Smoke test: ✅ \`/health\` respondeu"
          } >> "$GITHUB_STEP_SUMMARY"
